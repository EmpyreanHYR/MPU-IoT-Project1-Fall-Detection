name: Verify deployment and reproducibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: |
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r deployment/requirements-test.txt
      - name: Verify released asset hashes
        run: python scripts/verify_assets.py
      - name: Test recovery, real HTTP delivery, model parity and grouped folds
        run: python -m unittest discover -s tests -v
      - name: Verify two-input ONNX export
        run: python code/scripts/export_mamba_onnx.py artifacts/models/masked_bimamba.pt /tmp/quality-export.onnx --quality-input
