[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fallbench"
version = "0.1.0"
description = "Leakage-free fall-detection experiment pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.3,<2",
  "torch>=2.1,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

